[tool.poetry]
name = "kiro-monitor-backend"
version = "1.0.0"
description = "Backend API: Microservicios mock + Dashboard endpoints para Kiro Monitor Agent"
authors = ["DevMasters AWS Team"]
readme = "README.md"
packages = [{ include = "kiro_agent" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.110.0"
uvicorn = "^0.28.0"
pydantic = "^2.6.0"
pydantic-settings = "^2.2.0"
boto3 = "^1.34.0"
botocore = "^1.34.0"
python-dotenv = "^1.0.1"
httpx = "^0.27.0"
structlog = "^24.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.1.0"
pytest-asyncio = "^0.23.5"
moto = { extras = ["cloudwatch", "logs", "dynamodb"], version = "^5.0.3" }
httpx = "^0.27.0"
ruff = "^0.5.0"
black = "^24.4.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.black]
line-length = 120
target-version = ["py311"]
